<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HODŽIĆ TRANSPORT s.p. | Prevoz blaga od točke A do točke B</title>
  <style>
    :root {
      --navy: #0A2647;
      --navy-dark: #071A33;
      --green: #168A48;
      --green-dark: #116E39;
      --red: #D93829;
      --bg: #F8FAFC;
      --white: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* TOP BAR */
    .top-bar {
      background: var(--navy);
      color: var(--white);
      font-size: 0.9rem;
      padding: 9px 0;
    }

    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-bar a {
      color: #86EFAC;
      text-decoration: none;
      font-weight: 700;
    }

    /* HEADER */
    header {
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(10, 38, 71, 0.08);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-weight: 900;
      color: var(--navy);
      font-size: 1.15rem;
      text-decoration: none;
    }

    .brand-title span {
      color: var(--green);
      font-size: 0.8rem;
      display: block;
      letter-spacing: 0.6px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--navy);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .lang-btn {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: var(--navy);
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-green {
      background: var(--green);
      color: var(--white) !important;
      padding: 11px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-green:hover {
      background: var(--green-dark);
    }

    .btn-light {
      background: var(--white);
      color: var(--navy) !important;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
      padding: 56px 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 36px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: rgba(22, 138, 72, 0.25);
      border: 1px solid #4ADE80;
      color: #86EFAC;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 2.45rem;
      line-height: 1.18;
      margin-bottom: 14px;
    }

    .hero h1 span {
      color: #4ADE80;
    }

    .hero p {
      color: #CBD5E1;
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo-card {
      background: var(--white);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      border-top: 6px solid var(--green);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .logo-card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    /* SECTIONS */
    section {
      padding: 60px 0;
    }

    .sec-head {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 38px;
    }

    .sec-head h2 {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .sec-head p {
      color: var(--muted);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    .card h3 {
      color: var(--navy);
      margin-bottom: 8px;
      font-size: 1.15rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .card ul {
      list-style: none;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 0.9rem;
    }

    .card li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    /* CALCULATOR */
    .calc-wrap {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--navy);
    }

    .req-star {
      color: var(--red);
    }

    .field input,
    .field select,
    .field textarea {
      padding: 11px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    .field textarea {
      min-height: 76px;
      resize: vertical;
    }

    .field input.invalid-field {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(217, 56, 41, 0.15);
    }

    .result-box {
      background: var(--navy);
      color: var(--white);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .price-out {
      font-size: 2.1rem;
      font-weight: 900;
      color: #4ADE80;
      margin: 8px 0;
    }

    .status-msg {
      font-size: 0.85rem;
      color: #86EFAC;
      min-height: 20px;
      margin-top: 6px;
    }

    .status-msg.error {
      color: #FCA5A5;
    }

    /* FOOTER */
    footer {
      background: #06172D;
      color: #CBD5E1;
      padding: 36px 0;
      font-size: 0.92rem;
    }

    footer a {
      color: #86EFAC;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .hero-grid,
      .grid-3,
      .calc-wrap,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 1.95rem;
      }
    }
  </style>
</head>
<body>

    <div class="container top-bar-inner">
